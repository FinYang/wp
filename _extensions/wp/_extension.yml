title: Wp
author: Yangzhuoran Yang
version: 1.0.0
quarto-required: ">=1.10.0"
contributes:
  formats:
    common:
      toc: true
      filters:
        - blindable-div.lua
    pdf:
      documentclass: article
      papersize: a4
      fontsize: 12pt
      date: today
      date-format: "D MMMM YYYY"
      toc: false
      pdf-engine: pdflatex
      linestretch: 1.5
      geometry:
        - top=2.5cm
        - bottom=2.5cm
        - left=2.5cm
        - right=2.5cm
      execute: 
        echo: false
        warning: false
        message: false
      fig-height: 5
      fig-width: 8
      number-sections: true
      number-depth: 2
      template-partials:
        - "before-title.tex"
        - "title.tex"
      filters:
        - abstract-section